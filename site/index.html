<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="LearnPython — interactive coding courses"><title>LearnPython</title>
<style>
:root{--b:#050505;--p:#0d0d0d;--l:#292929;--t:#f5f5f5;--m:#999}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}button,input,textarea{font:inherit}header{height:68px;border-bottom:1px solid var(--l);position:sticky;top:0;background:#050505ed;backdrop-filter:blur(18px);display:flex;align-items:center;padding:0 5vw;z-index:10}.logo{font-size:22px;font-weight:900;letter-spacing:-.06em}.logo span{color:#999}.nav{margin-left:auto;display:flex;gap:8px}.nav a,.btn{padding:10px 13px;border:1px solid var(--l);border-radius:11px;background:#0d0d0d;color:#aaa}.primary{background:#fff!important;color:#000!important;border-color:#fff!important;font-weight:800}.wrap{width:min(1160px,92vw);margin:auto}.hero{padding:85px 0 55px;display:grid;grid-template-columns:1.15fr .85fr;gap:45px}.hero p{font-size:18px;line-height:1.7;color:var(--m);max-width:700px}h1{font-size:clamp(48px,7vw,88px);line-height:.92;letter-spacing:-.075em;margin:12px 0 22px}h2{letter-spacing:-.045em}.ey{font-size:11px;font-weight:900;letter-spacing:.16em}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}.terminal,.card,.coursehead,.lessonbody,.lab{border:1px solid var(--l);border-radius:18px;background:linear-gradient(145deg,#151515,#090909)}.terminal{padding:24px}.code,textarea,pre{font-family:ui-monospace,monospace}.code{white-space:pre-wrap;line-height:1.7}.section,.library{padding:50px 0 80px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:21px}.coursecard{min-height:255px;display:flex;flex-direction:column}.coursecard p{color:var(--m);line-height:1.6}.tag{font-size:10px;letter-spacing:.13em;border:1px solid #333;border-radius:999px;padding:5px 8px;width:max-content;color:#aaa}.meta{display:flex;justify-content:space-between;color:#777;font-size:12px;margin-top:auto;margin-bottom:13px}.search{width:100%;padding:15px;background:#090909;color:#fff;border:1px solid var(--l);border-radius:12px;margin:15px 0}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.filter{border:1px solid var(--l);border-radius:999px;padding:8px 12px;background:#0c0c0c;color:#aaa}.active{background:#fff;color:#000}.coursehead{padding:28px;margin:30px 0 20px}.progress{height:8px;background:#222;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#fff}.lesson{display:flex;gap:14px;align-items:center;padding:15px;border:1px solid var(--l);border-radius:13px;background:#0c0c0c;margin:8px 0}.lesson:hover{background:#151515}.num{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:#1b1b1b;font-weight:800}.lesson small{color:#777;margin-left:auto}.lessonpage{max-width:900px;margin:auto;padding:45px 0 80px}.lessonbody{padding:25px;line-height:1.75;background:#0d0d0d}.lessonbody h3{margin-top:27px}.lab{padding:20px;margin-top:18px;background:#0d0d0d}.lab textarea{width:100%;min-height:210px;background:#070707;color:#eee;border:1px solid var(--l);border-radius:11px;padding:15px}.preview{width:100%;height:300px;background:#fff;border:1px solid var(--l);border-radius:10px;margin-top:10px}footer{border-top:1px solid var(--l);padding:35px 5vw;color:#666;margin-top:30px}@media(max-width:850px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:1fr}} 
</style></head><body><header><a class="logo" href="#/">Learn<span>Python</span></a><nav class="nav"><a href="#/courses">Courses</a></nav></header><main class="wrap" id="app"></main><footer>LearnPython · Learn → practice → build · Progress is saved on this device.</footer>
<script>
const PY=["Why Python & Installing It","Understanding the Command Line","Running Your First Program","Variables & Data Types","Numbers & Math Operations","Strings","Booleans & Comparisons","Lists","Tuples & Sets","Dictionaries","Conditionals (if / elif / else)","Loops (for / while)","Functions","Reading Error Messages (Tracebacks)","Error Handling","Debugging Techniques","File Handling","Modules, Packages & Virtual Environments","Writing Clean Code (PEP 8 & Style)","Object-Oriented Programming I: Classes & Objects","Object-Oriented Programming II: Inheritance & Special Methods","Comprehensions","Lambda, map, filter","Working with Dates & Time","Regular Expressions","Iterators, Generators & Decorators","Working with APIs (requests)","Web Scraping Basics (BeautifulSoup)","Data Analysis with pandas","Automating Everyday Tasks","Building a CLI To-Do App","Working with Databases (SQLite)","Building a Mini Web App (Flask)","Testing Your Code","Capstone Project: Personal Expense Tracker","Appendix A: Python Glossary","Appendix B: Common Error Messages Cheat Sheet","Appendix C: Syntax Quick Reference","Appendix D: Mini Practice Projects","Appendix E: Setting Up VS Code for Python","Appendix F: Choosing the Right Data Structure","Reference Workshop: Glossary in Action","Reference Workshop: Error Decoder","Reference Workshop: Syntax Patterns","Reference Workshop: Project Builder","Reference Workshop: VS Code Workflow","Reference Workshop: Data Structure Lab"];
const COURSES=[
["python","The Ultimate Python Course","PYTHON","47 lessons · fundamentals → real projects",PY],
["ai","AI Fundamentals","AI","8 lessons · data → ML → LLMs → agents",["What Is AI?","Data: The Fuel","Machine Learning","Neural Networks","Generative AI & LLMs","Embeddings & Semantic Search","Agents, Tools & Safety","AI Capstone"]],
["go","Go (Golang)","GO","8 lessons · syntax → concurrency → CLI",["Meet Go","Variables & Types","If, Switch & For","Functions","Slices & Maps","Structs & Interfaces","Errors & Concurrency","Go Capstone"]],
["typescript","TypeScript","TS","8 lessons · types → async apps",["Why TypeScript?","Objects & Arrays","Functions & Aliases","Unions & Narrowing","Interfaces & Classes","Generics","Async, APIs & Modules","TypeScript Capstone"]],
["html","HTML","HTML","8 lessons · structure → accessible pages",["The Web Page Skeleton","Semantic Structure","Links & Images","Lists & Tables","Forms","Accessibility","Metadata & Page Quality","HTML Capstone"]],
["css","CSS","CSS","8 lessons · layout → responsive UI",["CSS Basics","Selectors & Specificity","The Box Model","Flexbox","CSS Grid","Responsive Design","Variables & Motion","CSS Capstone"]]
];
const app=document.getElementById("app"),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),find=s=>COURSES.find(c=>c[0]===s),getP=()=>JSON.parse(localStorage.getItem("lp-progress")||"{}"),done=(s,n)=>!!getP()[s]?.includes(n),mark=(s,n)=>{let p=getP();p[s]=[...(new Set([...(p[s]||[]),n]))];localStorage.setItem("lp-progress",JSON.stringify(p))};
function card(c){return '<a class="card coursecard" href="#/course/'+c[0]+'"><span class="tag">'+c[2]+'</span><h2>'+esc(c[1])+'</h2><p>'+esc(c[3])+'</p><div class="meta"><span>'+c[4].length+' lessons</span><span>Browser-first</span></div><span class="btn primary">Explore →</span></a>'}
function home(){app.innerHTML='<section class="hero"><div><div class="ey">THE INTERACTIVE CODE SCHOOL</div><h1>Learn code.<br>Actually build.</h1><p>Choose a course, learn one idea at a time, practice it immediately, and build things. No server required.</p><div class="actions"><a class="btn primary" href="#/courses">Explore courses</a><a class="btn" href="#/course/python">Start Python</a></div></div><div class="terminal"><div class="ey">~/learnpython</div><div class="code">course = choose("your path")\nlearn(course)\npractice(course)\nbuild(project)\n\n→ skill unlocked</div></div></section><section class="section"><div class="ey">COURSE LIBRARY</div><h2>Pick what you want to learn.</h2><div class="grid">'+COURSES.map(card).join("")+'</div></section>'}
function courses(){app.innerHTML='<section class="library"><div class="ey">THE LEARNING LIBRARY</div><h1>Pick a skill.<br><span style="color:#999">Build something.</span></h1><input id="q" class="search" placeholder="⌕ Search courses…"><div class="grid" id="cg"></div></section>';let r=()=>{let q=document.getElementById("q").value.toLowerCase();document.getElementById("cg").innerHTML=COURSES.filter(c=>(c[1]+" "+c[2]+" "+c[3]).toLowerCase().includes(q)).map(card).join("")};document.getElementById("q").oninput=r;r()}
function course(s){let c=find(s);if(!c)return bad();let p=getP()[s]||[],pct=Math.round(p.length/c[4].length*100);app.innerHTML='<section class="library"><a href="#/courses" style="color:#999">← Course library</a><div class="coursehead"><div class="ey">'+c[2]+'</div><h1 style="font-size:clamp(43px,6vw,70px)">'+esc(c[1])+'</h1><p style="font-size:18px;color:#aaa">'+esc(c[3])+'</p><div style="display:flex;justify-content:space-between;color:#777"><span>'+p.length+'/'+c[4].length+' complete</span><span>'+pct+'%</span></div><div class="progress"><i style="width:'+pct+'%"></i></div></div><h2>Curriculum</h2>'+c[4].map((x,i)=>'<a class="lesson" href="#/learn/'+s+'/'+(i+1)+'"><span class="num">'+String(i+1).padStart(2,"0")+'</span><span><b>'+esc(x)+'</b></span><small>'+(p.includes(i+1)?"✓ Complete":"→")+'</small></a>').join("")+'</section>'}
function lab(c){if(c[0]==="python")return '<div class="lab"><div class="ey">PYTHON LAB</div><p>Run Python locally in the browser using Pyodide.</p><textarea id="code">print("Hello from LearnPython!")\nprint(2 + 3)</textarea><div class="actions"><button class="btn primary" id="run">▶ Run Python</button></div><pre id="out">Ready.</pre></div>';if(c[0]==="html"||c[0]==="css")return '<div class="lab"><div class="ey">LIVE WEB LAB</div><textarea id="code"><div style="font-family:system-ui;padding:30px"><h1>Hello!</h1><p>Edit me.</p></div><style>h1{color:#111}</style></textarea><iframe id="preview" class="preview"></iframe></div>';if(c[0]==="ai")return '<div class="lab"><div class="ey">AI MINI LAB</div><input id="sent" class="search" placeholder="Try: this is awesome"><div id="sentout" style="color:#aaa">Waiting for input.</div></div>';return '<div class="lab"><div class="ey">PRACTICE MISSION</div><p>Write a tiny example using this lesson.</p><textarea placeholder="Your experiment / notes…"></textarea></div>'}
async function lesson(s,n){let c=find(s),title=c?.[4][n-1];if(!title)return bad();app.innerHTML='<section class="lessonpage"><a href="#/course/'+s+'" style="color:#999">← '+esc(c[1])+'</a><div class="ey" style="margin-top:30px">LESSON '+String(n).padStart(2,"0")+'</div><h1 style="font-size:clamp(43px,6vw,70px)">'+esc(title)+'</h1><div class="lessonbody"><h3>In Plain English</h3><p>This lesson teaches <b>'+esc(title)+'</b>. Learn the idea, inspect examples, then immediately change something yourself.</p><h3>Why This Matters</h3><p>The goal is usable skill, not just recognition. You should be able to explain the concept and use it in a small program.</p><h3>Try It Yourself</h3><p>Make one small experiment before moving to the next lesson. Predict what will happen, run it, and explain the result.</p><h3>Common Mistake</h3><p>Copying code without understanding why it works. Change one piece and observe what breaks.</p></div>'+lab(c)+'<div class="actions"><button class="btn primary" id="complete">'+(done(s,n)?"✓ Lesson completed":"✓ Mark lesson complete")+'</button><a class="btn" href="#/learn/'+s+'/'+Math.max(1,n-1)+'">← Previous</a><a class="btn primary" href="#/'+(n<c[4].length?"learn/"+s+"/"+(n+1):"course/"+s)+'">'+(n<c[4].length?"Next →":"Finish course →")+'</a></div></section>';document.getElementById("complete").onclick=()=>{mark(s,n);document.getElementById("complete").textContent="✓ Lesson completed"};if(c[0]==="html"||c[0]==="css"){let u=()=>document.getElementById("preview").srcdoc=document.getElementById("code").value;document.getElementById("code").oninput=u;u()}if(c[0]==="ai")document.getElementById("sent").oninput=e=>{let x=e.target.value.toLowerCase(),p=["love","great","good","awesome","amazing","happy"],q=["bad","hate","terrible","awful","sad","broken"],v=p.filter(w=>x.includes(w)).length-q.filter(w=>x.includes(w)).length;document.getElementById("sentout").textContent=!x?"Waiting for input.":v>0?"Positive-ish":v<0?"Negative-ish":"Neutral"};if(c[0]==="python")document.getElementById("run").onclick=async()=>{let o=document.getElementById("out");o.textContent="Loading Python…";try{if(!window.loadPyodide){let s=document.createElement("script");s.src="https://cdn.jsdelivr.net/pyodide/v0.27.2/full/pyodide.js";document.head.appendChild(s);await new Promise((r,j)=>{s.onload=r;s.onerror=j})}window.pyodide=window.pyodide||await loadPyodide();let x="";pyodide.setStdout({batched:t=>x+=t+"\n"});await pyodide.runPythonAsync(document.getElementById("code").value);o.textContent=x||"Done."}catch(e){o.textContent=String(e)}}}
function bad(){app.innerHTML='<section class="library"><h1>404</h1><a class="btn primary" href="#/">Back home</a></section>'}
function route(){let h=location.hash.slice(1)||"/";if(h==="/")home();else if(h==="/courses")courses();else{let m=h.match(/^\/course\/([^/]+)$/);if(m)course(m[1]);else{m=h.match(/^\/learn\/([^/]+)\/(\d+)$/);if(m)lesson(m[1],+m[2]);else bad()}}}addEventListener("hashchange",route);route();
</script></body></html>
